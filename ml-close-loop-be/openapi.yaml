      security:
      - HTTPBearer: []
  /api/v1/models/{model_id}/versions/{version}/lineage:
    get:
      tags:
      - Models
      summary: Get Model Version Lineage
      description: "Everything needed to answer \"where did this artifact come from?\" in\
        \ one call.\n\nIssue #236, from the meeting's fourth agenda item: which training,\
        \ when, which dataset,\nwhat metadata, what config. All of it existed, but across\
        \ five tables plus a sidecar, so a\ncaller had to join them by hand \u2014 and the\
        \ dataset's checksum and validation-report\nreference were not reachable at all (issue\
        \ #237 writes the report ref).\n\nUnresolvable pieces come back in `gaps[]` with a\
        \ reason, so \"we do not know this\" is\ndistinguishable from \"this is null\". Deliberately\
        \ not a pydantic response model: a fixed\nschema here would have to either drop the\
        \ gap detail or invent empty fields for answers\nthat do not exist, and this record's\
        \ whole value is being honest about what is missing."
      operationId: get_model_version_lineage_api_v1_models__model_id__versions__version__lineage_get
      security:
      - HTTPBearer: []
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Model Version Lineage Api V1 Models  Model Id  Versions  Version  Lineage
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
