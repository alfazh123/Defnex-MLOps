      - Inference
      summary: Run Inference
      description: 'Generate from a model, addressed by deployment alias (`prod`,
        resolved via the single

        `deployment_service.resolve_alias` function from issue #36) or by explicit
        version number.


        Unknown alias / missing version / never-deployed model are explicit 404s;
        a version that

        exists but is not the DEPLOYED one is 409; an upstream serving failure is
        502 - never a

        500 traceback (issue #41).'
      operationId: run_inference_api_v1_models__model_id__inference_post
      parameters:
      - name: model_id
        in: path
        required: true
