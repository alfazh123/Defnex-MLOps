          description: Conflict
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Artifact:
      properties:
        type:
          type: string
          enum:
          - adapter
          - merged
          - gguf
          title: Type
        uri:
          type: string
          title: Uri
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
      type: object
      required:
      - type
      - uri
      title: Artifact
      description: A stored model artifact (openapi.yaml Artifact).
    DatasetManifest:
      properties:
        source_type:
          anyOf:
          - type: string
            enum:
            - huggingface
            - file_upload
            - feedback
          - type: 'null'
          title: Source Type
        source_url_or_hf_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url Or Hf Id
        source_commit_or_snapshot_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Commit Or Snapshot Date
        source_format:
          type: string
          enum:
          - alpaca
          - sharegpt
          - chatml
          - other
          title: Source Format
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        row_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Row Count
        cleaning_steps_applied:
          items:
            type: string
          type: array
          title: Cleaning Steps Applied
          default: []
        source_feedback_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Source Feedback Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
      type: object
      required:
      - source_format
      - created_at
      title: DatasetManifest
      description: Per-version manifest fields (dataset-lifecycle-and-schema.md §2).
    DatasetSummary:
      properties:
        dataset_id:
          type: string
          title: Dataset Id
        latest_version:
          type: integer
          title: Latest Version
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - PROCESSED
          - FAILED
          title: Status
      type: object
      required:
      - dataset_id
      - latest_version
      - status
      title: DatasetSummary
      description: Lightweight list-view entry for GET /datasets.
    DatasetVersion:
      properties:
        dataset_id:
          type: string
          title: Dataset Id
        version:
          type: integer
          title: Version
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - PROCESSED
          - FAILED
          title: Status
        manifest:
          $ref: '#/components/schemas/DatasetManifest'
      type: object
      required:
      - dataset_id
      - version
      - status
      - manifest
      title: DatasetVersion
      description: A dataset version's manifest and current processing status (openapi.yaml
        DatasetVersion).
    DatasetVersionCreateRequest:
      properties:
        source_type:
          type: string
          enum:
          - huggingface
          - file_upload
          title: Source Type
        source_dataset:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Dataset
        source_commit_or_snapshot_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Commit Or Snapshot Date
        source_format:
          type: string
          enum:
          - alpaca
          - sharegpt
          - chatml
          - other
          title: Source Format
      type: object
      required:
      - source_type
      - source_format
      title: DatasetVersionCreateRequest
      description: Request to intake a new dataset version (openapi.yaml DatasetVersionCreateRequest).
    DecisionCreateRequest:
      properties:
        decision:
          type: string
          enum:
          - PROMOTED
          - REJECTED
          title: Decision
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        rationale:
          type: string
          title: Rationale
      type: object
      required:
      - decision
      - rationale
      title: DecisionCreateRequest
      description: 'Request body for POST .../decisions (openapi.yaml DecisionCreateRequest).
        Restricted to

        PROMOTED|REJECTED - ROLLBACK is only ever produced via POST /models/{model_id}/rollback
        (US-017).'
    DecisionRecord:
      properties:
        decision_id:
          type: string
          title: Decision Id
        model_id:
          type: string
          title: Model Id
        version:
          type: integer
          title: Version
        decision:
          type: string
          enum:
          - PROMOTED
          - REJECTED
          - ROLLBACK
          title: Decision
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_at:
          type: string
          format: date-time
          title: Decided At
        evidence_snapshot:
          anyOf:
          - $ref: '#/components/schemas/EvaluationObject'
          - type: 'null'
        eval_set_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Eval Set Id
        eval_set_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Eval Set Version
        rationale:
          type: string
          title: Rationale
        rollback_of_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rollback Of Version
      type: object
      required:
      - decision_id
      - model_id
      - version
      - decision
      - decided_at
      - rationale
      title: DecisionRecord
      description: 'WBS 3.3 §8 decision record (openapi.yaml DecisionRecord) - covers
        promotion, rejection, and

        rollback with one schema.'
    DeployResult:
      properties:
        model_id:
          type: string
          title: Model Id
        current_deployed_version:
          type: integer
          title: Current Deployed Version
        previous_deployed_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Previous Deployed Version
      type: object
      required:
      - model_id
      - current_deployed_version
      title: DeployResult
      description: Response for POST .../deploy (openapi.yaml DeployResult).
    DeploymentStatus:
      properties:
        model_id:
          type: string
          title: Model Id
        current_deployed_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Deployed Version
        deployed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deployed At
        status:
          anyOf:
          - type: string
            const: DEPLOYED
          - type: 'null'
          title: Status
      type: object
      required:
      - model_id
      title: DeploymentStatus
      description: 'The model-level deployment pointer (openapi.yaml DeploymentStatus),
        a separate resource

        from any single version''s registry record. `status` has no full enum yet
        - only "DEPLOYED"

        is confirmed by any source document - and is null when nothing has ever been
        deployed.'
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorDetail
      description: openapi.yaml Error.error (PRD §18 standard error envelope).
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'openapi.yaml Error — `{"error": {"code": ..., "message": ...}}`.'
    EvalLossTrend:
      properties:
        previous_version_eval_loss:
          anyOf:
          - type: number
          - type: 'null'
          title: Previous Version Eval Loss
        this_version_eval_loss:
          type: number
          title: This Version Eval Loss
      type: object
      required:
      - this_version_eval_loss
      title: EvalLossTrend
    EvalSetSummary:
      properties:
        eval_set_id:
          type: string
          title: Eval Set Id
        latest_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Version
        version_count:
          type: integer
          title: Version Count
          default: 0
      type: object
      required:
      - eval_set_id
      title: EvalSetSummary
      description: Lightweight list-view entry for GET /eval-sets (openapi.yaml EvalSetSummary).
    EvalSetVersion:
      properties:
        eval_set_id:
          type: string
          title: Eval Set Id
        version:
          type: integer
          title: Version
        record_count:
          type: integer
          title: Record Count
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
