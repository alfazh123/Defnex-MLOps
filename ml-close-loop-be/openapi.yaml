      description: "Dataset-level validation report (validation-rules.md \xA75/\xA77, openapi.yaml\
        \ ValidationReport)."
    ValidationStatusCounts:
      properties:
        VALID:
          type: integer
          title: Valid
          default: 0
        INVALID:
          type: integer
          title: Invalid
          default: 0
        NEEDS_REVIEW:
          type: integer
          title: Needs Review
          default: 0
      type: object
      title: ValidationStatusCounts
      description: "Per-record status tally (validation-rules.md \xA72).\n\n\nNEEDS_REVIEW\
        \ is always 0: a per-record NEEDS_REVIEW status would need a warning-class\nthreshold\
        \ (W2/W5), which validation-rules.md does not define. Do not confuse it with\nthe\
        \ dataset-level `gate_decision == NEEDS_REVIEW`, which is driven by the hard-error\n\
        ratio (issue #241) and is reachable."
