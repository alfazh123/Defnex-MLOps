          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Eval Sets
      summary: List Eval Set Versions
      operationId: list_eval_set_versions_api_v1_eval_sets__eval_set_id__versions_get
      parameters:
      - name: eval_set_id
        in: path
        required: true
        schema:
          type: string
          title: Eval Set Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvalSetVersion'
                title: Response List Eval Set Versions Api V1 Eval Sets  Eval Set Id  Versions
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/eval-sets:
    get:
      tags:
      - Eval Sets
      summary: List Eval Sets
      operationId: list_eval_sets_api_v1_eval_sets_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: authorization
        in: header
