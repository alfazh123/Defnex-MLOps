      title: ValidateDatasetVersionRequest
      description: "Optional body for POST .../validate (openapi.yaml ValidateDatasetVersionRequest).\n\
        \n`records` is the actual record content to run the hard-error rules against \u2014\
        \ the\nclient supplies it because no intake/normalization pipeline persists record\
        \ content\nin this system yet (see progress.txt US-005/US-006). It is required and\
        \ must be\nnon-empty so a validation report can never claim PASS over content that\
        \ was never\nexamined; the report records a SHA-256 fingerprint of exactly what was\
        \ checked.\n`eval_records` is the legacy inline eval-set content for the H8 leakage\
        \ check;\n`eval_set_id`/`eval_set_version` reference a stored golden/eval set (issue\
        \ #43) and\ntake precedence when both are supplied -- the stored eval set is the real\
        \ comparison\nsurface for the H8 check."
