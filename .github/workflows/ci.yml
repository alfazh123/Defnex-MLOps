name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.13
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml-close-loop-be/pyproject.toml
      - run: pip install -e ".[dev,intake]"
      - run: pytest -q --tb=short --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite:///ci-test.db"
          JWT_SECRET: "ci-test-secret-key-do-not-use-in-production"
          UNSLOTH_STUDIO_URL: "http://localhost:8001"

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit --desc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-close-loop-fe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ml-close-loop-fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
