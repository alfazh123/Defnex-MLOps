name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.15.13
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml-close-loop-be/pyproject.toml
      - run: pip install -e ".[dev,intake]"
      - run: pytest -q --tb=short --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: "sqlite:///ci-test.db"
          JWT_SECRET: "ci-test-secret-key-do-not-use-in-production"
          UNSLOTH_STUDIO_URL: "http://localhost:8001"

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ml-close-loop-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit --desc
      - run: pip install bandit
      # SAST (issue #175). `-b .bandit-baseline.json` only fails on issues NOT already in the
      # tracked baseline (27 pre-existing findings as of 2026-09-20, see issue #182) - a hard
      # gate on every existing finding would break CI for every future unrelated PR until that
      # backlog is cleared. New code must not add issues beyond the baseline.
      - run: bandit -r app -ll -b .bandit-baseline.json

  secret-scan:
    # Issue #175. Separate job (not a step in `security`) because gitleaks needs full git
    # history (fetch-depth: 0), unlike every other job's shallow checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    # Issue #175. Builds the backend image and scans it for known CVEs - report-only for now
    # (exit-code: '0'): the base image (python:3.12-slim) and OS packages can carry CVEs this
    # repo has no control over, so a hard gate here would fail CI for reasons unrelated to any
    # given PR until someone deliberately decides a severity/fix policy for those.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t defnex-mlops-be:ci ./ml-close-loop-be
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: defnex-mlops-be:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-close-loop-fe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ml-close-loop-fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
