      operationId: get_eval_set_version_api_v1_eval_sets__eval_set_id__versions__version__get
      parameters:
      - name: eval_set_id
        in: path
        required: true
        schema:
          type: string
          title: Eval Set Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalSetVersion'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/feedback:
    post:
      tags:
      - Feedback
      summary: Submit Feedback
      description: 'Submit feedback on an inference response (issue #42). `model_id`/`version`
        must be an

        existing model version - `get_model_version_or_404` (issue #36''s helper) resolves
        it the

        same way every other model-version-scoped endpoint does.'
      operationId: submit_feedback_api_v1_feedback_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRecord'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: List Feedback
      description: '`fl.status` filters on curation_status (PENDING/APPROVED/REJECTED); `fl.model`
        filters

        on the referenced model_id - same `FilterParams`/`PaginationParams` every other list

        endpoint uses, no new pagination/filter logic (issue #42''s own explicit requirement).'
      operationId: list_feedback_api_v1_feedback_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_FeedbackRecord_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/feedback/candidates:
    get:
      tags:
      - Feedback
      summary: List Candidates
      description: 'Every APPROVED feedback row as a canonical record, ready to feed straight
        into

        `POST .../validate` or the from-feedback dataset-version endpoint (issue #42).'
      operationId: list_candidates_api_v1_feedback_candidates_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Candidates Api V1 Feedback Candidates Get
        '422':
