          - PROMOTED
          - REJECTED
          - DEPLOYED
          - RETIRED
          - ARCHIVED
          - STAGING
          - VALIDATED
          - PRODUCTION
          title: Status
      type: object
      required:
      - evaluation
      - status
      title: EvaluationSubmitResponse
      description: Inline response shape for POST .../evaluation (openapi.yaml, not a named
        component).
    EvaluationTriggerRequest:
      properties:
        eval_set_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Eval Set Id
        eval_set_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Eval Set Version
      additionalProperties: false
      type: object
      title: EvaluationTriggerRequest
      description: 'Request body for `POST .../evaluation` (issue #128, openapi.yaml EvaluationUpdateRequest).


        Trigger-only: the endpoint no longer accepts caller-supplied signal numbers (`eval_loss_trend`,

        `qualitative_comparison`, `general_domain_regression_check`) - those are now computed

        server-side by the evaluation worker against the stored golden/eval set (issue #43)
        via

        `ServingBackend`. `extra="forbid"` makes a request still shaped like the old manual
        payload

        fail with 422 rather than silently accepting/ignoring caller-controlled evaluation
        results.

        `eval_set_id`/`eval_set_version` (optional) name/override the golden set to evaluate
        against;

        when omitted, the model version''s already-stored eval set reference is used.'
    FeedbackCreateRequest:
      properties:
        model_id:
          type: string
          title: Model Id
        version:
          type: integer
          title: Version
        prompt:
          type: string
          minLength: 1
          title: Prompt
        response:
          type: string
          minLength: 1
          title: Response
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
        correction:
          anyOf:
          - type: string
          - type: 'null'
          title: Correction
      type: object
      required:
      - model_id
      - version
      - prompt
      - response
      - rating
      title: FeedbackCreateRequest
      description: 'Submit feedback on an inference response (issue #42).


        `model_id`/`version` identify the concrete `ModelVersion` that produced `response`

        (`InferenceResponse.model_id`/`version`, issue #41) - not an alias, so the reference
        is

        traceable to an exact version regardless of what is DEPLOYED later. `rating` is a
        plain

        1-5 input-validation bound (a common feedback scale), not an invented evaluation metric.

        `correction` is optional - a human-authored better answer, when the reviewer has one.'
