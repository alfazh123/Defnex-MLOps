  /api/v1/models/{model_id}/deployment/{alias}:
    get:
      tags:
      - Deployment
      summary: Resolve Deployment Alias
      description: 'Resolve a named deployment alias (currently only `prod`) to the
        currently DEPLOYED version, via the single resolution function
        `deployment_service.resolve_alias`. 404 MODEL_NOT_FOUND if the model is
        unknown; 404 DEPLOYMENT_NOT_FOUND (explicit - never a propagating None) if
        the model has never been deployed; 422 UNKNOWN_DEPLOYMENT_ALIAS for any
        alias other than `prod`.'
      operationId: get_deployment_by_alias_api_v1_models__model_id__deployment__alias__get
      parameters:
      - name: model_id
