services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Reach the existing standalone defnex-vllm via Docker bridge gateway (verified by live test).
      VLLM_URL: http://172.17.0.1:8001
      SERVING_BACKEND: vllm
      SERVED_BASE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ./docker-entrypoint.sh

  worker:
    build: .
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      # Mount the same host dir as defnex-vllm's /models so artifacts are visible to both.
      - /home/ubuntu/defnex-mlops-experiment/outputs:/models
      # Mount the experiment venv for ML deps (Python 3.12 matches the 3.12-slim base image).
      - /home/ubuntu/defnex-mlops-experiment/.venv:/opt/training-venv:ro
    environment:
      VLLM_URL: http://172.17.0.1:8001
      SERVING_BACKEND: vllm
      SERVED_BASE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      ARTIFACT_STORAGE_DIR: /models/artifacts
      TRAINING_PYTHON: /opt/training-venv/bin/python
      MINIO_ENDPOINT: minio:9000
      SERVING_CONTROL: file_signal
      GPU_CONTROL_DIR: /models/.gpu-control
      VRAM_FREE_THRESHOLD_MB: 8000
      TRAINING_TIMEOUT_SECONDS: "600"
    command: ./docker-worker-entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - backend

  # The real model-serving stack (issue #40). GPU-only: excluded from `docker compose up`
  # unless the `gpu` profile is explicitly enabled. vLLM serves the base model and loads
  # per-version LoRA adapters at runtime (load/unload over the vLLM runtime API, no restart).
  # Runtime LoRA updates require `VLLM_ALLOW_RUNTIME_LORA_UPDATING=true` and `--enable-lora`.
  # NOTE: This profile is for fresh environments. If an externally-managed vLLM already exists
  # (e.g. defnex-vllm), do NOT enable this profile — it will conflict on port 8001. Use
  # VLLM_URL to point at the existing vLLM instead.
  serving:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    env_file: .env
    environment:
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "true"
    ports:
      # host port defaults to 8002 (8001 is used by the standalone defnex-vllm); requires
      # SERVING_BACKEND=vllm to be used.
      - "${VLLM_SERVING_PORT:-8002}:8000"
    volumes:
      # Adapter artifacts written by the training worker live under ./data; vLLM mounts them
      # at /data so `lora_path` URIs (file:///data/...) resolve inside the serving container.
      - ./data:/data
    command:
      - --model
      - ${VLLM_MODEL_NAME:-unsloth/Qwen3-0.6B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-defnex-model}
      - --enable-lora
      - --max-loras
      - ${VLLM_MAX_LORAS:-4}
      - --max-lora-rank
      - ${VLLM_MAX_LORA_RANK:-64}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s

  # MinIO / S3-compatible object storage (issue #71, PRD §13.1/§13.2/§32).
  # Stores artifact (adapter/model) and dataset bytes; metadata stays in PostgreSQL.
  # No GPU needed, so it is intentionally NOT in the `gpu` profile. API on :9000,
  # web console on :9001. The backend reaches it via the MINIO_* settings (.env).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

volumes:
  minio-data:
