[project]
name = "mlops-backend"
version = "0.1.0"
description = "DEFNEX MLOps Backend — orchestration API for the closed-loop MLOps prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.1.3",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]
intake = [
    "huggingface_hub>=0.25",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=app", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"tests/*.py" = ["SIM117"]
