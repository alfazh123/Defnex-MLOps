        training worker: the run is transitioned to RUNNING only when the worker picks it up,
        and to COMPLETED or FAILED (with an error_message) when it finishes or fails to start.
        A failure to start training is never swallowed at request time; it surfaces as a FAILED
        run with an explicit error_message.
