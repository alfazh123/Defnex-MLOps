services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # ── External vLLM dependency (issue #162) ──────────────────────────────
      # The real model-serving stack (defnex-vllm) runs in a SEPARATE Docker
      # Compose project (defnex-mlops-experiment) on its own network. This
      # backend reaches it via the Docker bridge gateway IP (172.17.0.1:8001).
      # Changing this URL requires matching changes in the external project.
      # See docs/runbooks/vllm-dependency.md for full details.
      VLLM_URL: http://172.17.0.1:8001
      SERVING_BACKEND: vllm
      SERVED_BASE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ./docker-entrypoint.sh

  worker:
    build: .
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      # ── External vLLM dependency (issue #162) ──────────────────────────────
      # These mounts point at the external defnex-mlops-experiment project's
      # output directory and training venv. Both paths are managed outside this
      # repository. Changing them requires matching changes in the external
      # project. See docs/runbooks/vllm-dependency.md for full details.
      - /home/ubuntu/defnex-mlops-experiment/outputs:/models
      - /home/ubuntu/defnex-mlops-experiment/.venv:/opt/training-venv:ro
    environment:
      VLLM_URL: http://172.17.0.1:8001
      SERVING_BACKEND: vllm
      SERVED_BASE_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      ARTIFACT_STORAGE_DIR: /models/artifacts
      TRAINING_PYTHON: /opt/training-venv/bin/python
      MINIO_ENDPOINT: minio:9000
      SERVING_CONTROL: file_signal
      GPU_CONTROL_DIR: /models/.gpu-control
      VRAM_FREE_THRESHOLD_MB: 8000
      TRAINING_TIMEOUT_SECONDS: "600"
    command: ./docker-worker-entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - backend

  # ── Self-contained vLLM serving (GPU profile) ────────────────────────────
  # GPU-only: excluded from `docker compose up` unless the `gpu` profile is
  # explicitly enabled (`docker compose --profile gpu up`). vLLM serves the
  # base model and loads per-version LoRA adapters at runtime.
  #
  # IMPORTANT: This profile is for FRESH environments only. If an externally-
  # managed vLLM already exists (e.g. defnex-vllm from the
  # defnex-mlops-experiment project), do NOT enable this profile — it will
  # conflict on port 8001. Instead, keep VLLM_URL pointed at the external
  # vLLM. See docs/runbooks/vllm-dependency.md for details.
  serving:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    env_file: .env
    environment:
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "true"
    ports:
      # host port defaults to 8002 (8001 is used by the standalone defnex-vllm); requires
      # SERVING_BACKEND=vllm to be used.
      - "${VLLM_SERVING_PORT:-8002}:8000"
    volumes:
      # Adapter artifacts written by the training worker live under ./data; vLLM mounts them
      # at /data so `lora_path` URIs (file:///data/...) resolve inside the serving container.
      - ./data:/data
      # Read-only mount of the experiment artifact storage so runtime LoRA can load
      # adapters from /models/artifacts/... (same mount as defnex-vllm and worker).
      - /home/ubuntu/defnex-mlops-experiment/outputs:/models:ro
    command:
      - --model
      - ${VLLM_MODEL_NAME:-unsloth/Qwen3-0.6B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-defnex-model}
      - --enable-lora
      - --max-loras
      - ${VLLM_MAX_LORAS:-4}
      - --max-lora-rank
      - ${VLLM_MAX_LORA_RANK:-64}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.15}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-1024}
      - --dtype
      - bfloat16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s

  # MinIO / S3-compatible object storage (issue #71, PRD §13.1/§13.2/§32).
  # Stores artifact (adapter/model) and dataset bytes; metadata stays in PostgreSQL.
  # No GPU needed, so it is intentionally NOT in the `gpu` profile. API on :9000,
  # web console on :9001. The backend reaches it via the MINIO_* settings (.env).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

volumes:
  minio-data:
