        version, via the

        single resolution function `deployment_service.resolve_alias` (openapi.yaml
        DeploymentStatus

        alias resolution). Unknown alias -> 422, model unknown -> 404 MODEL_NOT_FOUND,
        model never

        deployed -> 404 DEPLOYMENT_NOT_FOUND (explicit - never a None that propagates).'
      operationId: get_deployment_by_alias_api_v1_models__model_id__deployment__alias__get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
