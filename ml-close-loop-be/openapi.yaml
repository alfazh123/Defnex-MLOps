      title: DeployResult
      description: Response for POST .../deploy (openapi.yaml DeployResult).
    DeploymentStatus:
      properties:
        model_id:
          type: string
          title: Model Id
        current_deployed_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Deployed Version
        deployed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deployed At
        status:
          anyOf:
          - type: string
            const: DEPLOYED
          - type: 'null'
          title: Status
      type: object
      required:
      - model_id
      title: DeploymentStatus
      description: 'The model-level deployment pointer (openapi.yaml DeploymentStatus).
        A separate resource

        from any single version''s registry record. `status` has no full enum yet
        - only "DEPLOYED"

        is confirmed by any source document - and is null when nothing has ever been
        deployed.

        Single source of truth (issue #36): the production version is the ModelVersion
        whose

        `status == "DEPLOYED"` in the model registry; the `deployments` table is append-only
        pointer

        history contributing only `deployed_at`. A partial unique index
        (`uq_model_versions_one_deployed`,

        WHERE status = "DEPLOYED") makes two DEPLOYED versions for one `model_id` impossible at
        the DB

        level. Alias resolution (`GET /models/{model_id}/deployment/{alias}`, currently only
        `prod`)

        resolves the same DEPLOYED version through `deployment_service.resolve_alias` and
        returns this

        same schema; it 404s explicitly (`DEPLOYMENT_NOT_FOUND`) when nothing has ever been
        deployed.'
