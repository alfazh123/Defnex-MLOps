        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetVersionCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Datasets
      summary: List Dataset Versions
      operationId: list_dataset_versions_api_v1_datasets__dataset_id__versions_get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
                title: Response List Dataset Versions Api V1 Datasets  Dataset Id  Versions
                  Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/datasets/{dataset_id}/versions/from-feedback:
    post:
      tags:
      - Datasets
      summary: Create Dataset Version From Feedback
      description: 'Create a dataset version from curated, APPROVED feedback (issue #42) -
        closes the

        loop from inference response -> feedback -> next training dataset.'
      operationId: create_dataset_version_from_feedback_api_v1_datasets__dataset_id__versions_from_feedback_post
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackDatasetVersionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/datasets/{dataset_id}/versions/{version}:
    get:
      tags:
      - Datasets
      summary: Get Dataset Version
      operationId: get_dataset_version_api_v1_datasets__dataset_id__versions__version__get
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          title: Dataset Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/eval-sets/{eval_set_id}/versions:
    post:
      tags:
      - Eval Sets
      summary: Create Eval Set Version
      operationId: create_eval_set_version_api_v1_eval_sets__eval_set_id__versions_post
      parameters:
      - name: eval_set_id
        in: path
        required: true
        schema:
          type: string
          title: Eval Set Id
      - name: authorization
        in: header
        required: false
        schema:
