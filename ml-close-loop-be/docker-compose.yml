services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ./docker-entrypoint.sh

  worker:
    build: .
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ./docker-worker-entrypoint.sh
    depends_on:
      - backend

