          additionalProperties:
            type: integer
          type: object
          title: Warnings Summary
          default: {}
        dataset_statistics:
          additionalProperties: true
          type: object
          title: Dataset Statistics
          default: {}
        per_record_errors:
          items:
            items:
              type: string
            type: array
          type: array
          title: Per Record Errors
          default: []
        records:
          description: 'Echoes exactly what was examined, so it is not narrowed to `dict`:
            intake can

            surface a parsed value that is not a JSON object (issue #245), and the H0 shape

            rules report that per record rather than this field silently dropping or

            crashing on it.'
          items: {}
          type: array
          title: Records
          default: []
        gate_decision:
          description: 'Dataset-level verdict. `NEEDS_REVIEW` (issue #241) means some records
            carry hard

            errors but the rate is below `VALIDATION_GATE_FAIL_RATIO`: the dataset may be

            committed for inspection, but `POST /training-runs` refuses it with

            `VALIDATION_NEEDS_REVIEW` until a re-validated version reaches PASS. Policy:

            docs/dataset/validation-gate-policy.md.'
          type: string
          enum:
          - PASS
          - NEEDS_REVIEW
          - FAIL
          title: Gate Decision
